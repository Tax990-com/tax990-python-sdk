[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tax990-sdk"
version = "0.1.0"
description = "Official Python SDK for the Tax990 Public API"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["tax990", "irs", "form-990", "nonprofit", "sdk"]
dependencies = [
    "httpx>=0.25.0",
    "pyjwt>=2.8.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "mypy>=1.7.0",
    "ruff>=0.1.0",
    "respx>=0.20.0",
]

[tool.hatch.build.targets.wheel]
packages = ["tax990"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.13"
strict = true
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501"]
