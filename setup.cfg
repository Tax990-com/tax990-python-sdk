[metadata]
name = tax990-sdk
version = 0.1.0
description = Official Python SDK for the Tax990 Public API
long_description = file: README.md
long_description_content_type = text/markdown
license = MIT
python_requires = >=3.9

[options]
packages = find:
install_requires =
    httpx>=0.25.0
    pyjwt>=2.8.0
    pydantic>=2.0.0
    python-dotenv>=1.0.0

[options.extras_require]
dev =
    pytest>=7.4.0
    pytest-asyncio>=0.23.0
    mypy>=1.7.0
    ruff>=0.1.0
    respx>=0.20.0

[options.packages.find]
exclude =
    tests*
    examples*
